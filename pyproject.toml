[project]
name = "ai-code-review-tui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "textual>=8.2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.ruff.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
preview = true
